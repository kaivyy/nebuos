set default=0
set timeout=3

insmod btrfs
search --no-floppy --label --set=root root
insmod blscfg
blscfg

menuentry 'NebuOS Foundation (Milestone P0)' {
    insmod btrfs
    search --no-floppy --label --set=root root
    linux /boot/vmlinuz-7.1.13-200.fc44.x86_64 root=LABEL=root ro console=tty0 console=ttyS0,115200n8 quiet systemd.show_status=auto panic=10
    initrd /boot/initramfs-7.1.13-200.fc44.x86_64.img
}

menuentry 'NebuOS Foundation (Fallback / Emergency)' {
    insmod btrfs
    search --no-floppy --label --set=root root
    linux /boot/vmlinuz-7.1.13-200.fc44.x86_64 root=LABEL=root ro console=tty0 console=ttyS0,115200n8 systemd.unit=emergency.target
    initrd /boot/initramfs-7.1.13-200.fc44.x86_64.img
}
